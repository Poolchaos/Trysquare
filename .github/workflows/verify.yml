name: verify

on:
  push:
    branches: [main]
  pull_request:

# The gate reads the repository and nothing else. Stated here so that a
# change to the repository's default cannot widen it.
permissions:
  contents: read

jobs:
  verify:
    # Ubuntu and macOS are required on main. Windows runs as information
    # only since D-232: nobody working on the app uses it, so a failure it
    # alone shows is recorded and left (D-246). A failure macOS alone shows
    # is parked the same way while Linux comes first (D-245, D-246).
    # The three platforms the MVP was built for (D-85). macOS has no person
    # driving it, so this job is its proof (D-86). fail-fast is off so one
    # platform's failure never hides another's result.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hang is a failure, and without a limit GitHub waits six hours: run
    # 39115191562 sat 35 minutes until it was cancelled by hand. The eight
    # green runs from 43bee5f to 60a438d took 6m13s to 10m10s.
    timeout-minutes: 30
    defaults:
      run:
        # verify.sh is bash; on Windows this is Git Bash, as it is locally.
        shell: bash
    steps:
      # Actions are named by commit, with the release beside it: a tag can be
      # moved to other code, a commit cannot. Dependabot proposes the moves
      # (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Plain, as a user would run it: the install itself is under test
      # (D-87, D-92).
      - run: npm ci

      # The browser the journey runs in. Only chromium: the app is a local
      # tool, and a second engine would double the run for no question it
      # answers.
      - run: npx playwright install --with-deps chromium

      # The same gate contributors run locally, plus the production build and
      # the browser journey. Nothing is checked here that ./verify.sh does not
      # check; the local default stays fast by leaving these two off.
      - run: ./verify.sh --build --e2e

      # The free end-to-end demo, which the README tells people to run first.
      - run: npm run demo:fixture -- --fake

      # Windows once refused a loopback connect with WSAENOBUFS, Chromium's
      # ERR_NO_BUFFER_SPACE (D-100), while the suite's own peak was 267
      # sockets. The TCP table goes into the evidence, so a recurrence says
      # whether the runner had run out of ports.
      - if: failure() && runner.os == 'Windows'
        run: |
          mkdir -p test-results
          netstat -ano -p tcp > test-results/tcp-table.txt
          awk '$1 == "TCP" { print $4 }' test-results/tcp-table.txt | sort | uniq -c | tee test-results/tcp-summary.txt

      # The evidence a failure is diagnosed from, and the screenshots the
      # design review reads. Uploaded on failure and on success both: a green
      # run's screenshots are the record of what the app actually looked like
      # at that commit, which is the point of photographing it.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.os }}
          path: |
            review/
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
