name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The three platforms the MVP supports (D-85). macOS has no person
    # driving it, so this job is its proof (D-86). fail-fast is off so one
    # platform's failure never hides another's result.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # verify.sh is bash; on Windows this is Git Bash, as it is locally.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Plain, as a user would run it: the install itself is under test
      # (D-87, D-92).
      - run: npm ci

      # The browser the journey runs in. Only chromium: the app is a local
      # tool, and a second engine would double the run for no question it
      # answers.
      - run: npx playwright install --with-deps chromium

      # The same gate contributors run locally, plus the production build and
      # the browser journey. Nothing is checked here that ./verify.sh does not
      # check; the local default stays fast by leaving these two off.
      - run: ./verify.sh --build --e2e

      # The free end-to-end demo, which the README tells people to run first.
      - run: npm run demo:fixture -- --fake

      # Windows once refused a loopback connect with WSAENOBUFS, Chromium's
      # ERR_NO_BUFFER_SPACE (D-100), while the suite's own peak was 267
      # sockets. The TCP table goes into the evidence, so a recurrence says
      # whether the runner had run out of ports.
      - if: failure() && runner.os == 'Windows'
        run: |
          mkdir -p test-results
          netstat -ano -p tcp > test-results/tcp-table.txt
          awk '$1 == "TCP" { print $4 }' test-results/tcp-table.txt | sort | uniq -c | tee test-results/tcp-summary.txt

      # The evidence a failure is diagnosed from, and the screenshots the
      # design review reads. Uploaded on failure and on success both: a green
      # run's screenshots are the record of what the app actually looked like
      # at that commit, which is the point of photographing it.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: |
            review/
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
